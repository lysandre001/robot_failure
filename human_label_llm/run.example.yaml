# Copy to run.yaml and fill in model slugs.
run_id: 20260529_object_v1

input_csv: human_label_llm/label_data/clean_comments_robot_human_filtered_sample10_per_post(labelled) - clean_comments_robot_human_filtered_sample10_per_post(labelled).csv
posts_csv: data/rawdata/posts.csv

prompt: eval_object_v1

columns:
  comment_id: comment_id
  comment: content
  title: 帖子标题
  caption: post_caption
  gold: 评估对象

gold_column: 评估对象

posts_join:
  post_id: 帖子id
  caption_from: 帖子正文

scope_slots:
  scope_comment_only: [comment]
  scope_comment_title: [comment, title]
  scope_comment_title_caption: [comment, title, caption]

scopes:
  - scope_comment_only
  - scope_comment_title
  - scope_comment_title_caption

# model_key → provider + model slug（OpenAI-compatible API）
# 字符串 slug 默认走 openrouter；可指定 provider 或 fallback chain
models:
  claude_4_7: anthropic/claude-opus-4.7

  gpt_5_5:
    provider: openrouter
    model: openai/gpt-5.5

  deepseek_v4_pro:
    provider: deepseek
    model: deepseek-v4-pro
    reasoning: on
    reasoning_effort: high   # high | max

  deepseek_v4_pro_or:
    reasoning: on
    reasoning_effort: high
    chain:
      - provider: openrouter
        model: deepseek/deepseek-v4-pro
      - provider: deepseek
        model: deepseek-v4-pro

  qwen_sf:
    chain:
      - provider: siliconflow
        model: Qwen/Qwen3-235B-A22B
      - provider: openrouter
        model: qwen/qwen3-235b-a22b

# API keys（.env 或环境变量）：
#   OPENROUTER_API_KEY
#   SILICONFLOW_API_KEY  （或 SILICONFLOW_api_key）
#   DEEPSEEK_API_KEY

temperature: 0.0
max_tokens: 512
concurrency: 4
timeout: 120
limit: null
