# All YouTube L1 comments, two batches. Same na prompt as the 500-row Kimi K3 run.
# moonshotai/kimi-k3 has no flex endpoint, so routing stays on the standard tier.
extends: _defaults.yaml

run_id: 20261116_youtube_l1_subject_topic9_kimi_k3
platform: youtube
prompt_lang: en
prompt: 20261030_subject_topic9_v1_primary_na
output_root: output/label_runs
metric: any_hit

data:
  input_csv: human_label_llm/label_data/youtube_2events_l1_20261116.csv

columns:
  comment_id: comment_id
  comment: content_en

scopes:
  - scope_comment_only

model_catalog:
  kimi_k3_or:
    provider: openrouter
    model: moonshotai/kimi-k3
    reasoning: off

model_keys:
  - kimi_k3_or

limit: null
temperature: 0.0
concurrency: 4
timeout: 180
# 2048 reserves more output budget than the remaining credits allow.
max_tokens: 256
