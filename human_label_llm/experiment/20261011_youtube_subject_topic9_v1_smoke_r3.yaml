extends: _defaults.yaml

run_id: 20261011_youtube_subject_topic9_v1_smoke_r3
platform: youtube
prompt_lang: en
prompt: 20261011_subject_topic9_v1
output_root: output/label_runs
metric: any_hit
gold_column: 对象

data:
  input_csv: human_label_llm/label_data/gold/youtube_2604-marathon_subject_topic9_20261011.csv

columns:
  comment_id: comment_id
  comment: content_en
  gold: 对象

scopes:
  - scope_comment_only

model_catalog:
