# Same as v3 Robot|Imagination|Self open concepts; model = OpenRouter gpt-oss-120b.
extends: _defaults.yaml

run_id: 20261119_youtube_l1_open_concepts_v3_robot_imagination_self_gpt_oss_120b
platform: youtube
prompt_lang: en
prompt: 20261119_open_concepts_v3
output_root: output/concept_extract

data:
  input_csv: human_label_llm/label_data/youtube_l1_object_robot_imagination_self_20261119.csv

columns:
  comment_id: comment_id
  comment: content_en

scopes:
  - scope_comment_only

model_catalog:
  gpt_oss_120b_or:
    provider: openrouter
    model: openai/gpt-oss-120b
    # Endpoint rejects reasoning off (same pattern as gpt-6.1-sol).
    reasoning: on
    reasoning_effort: minimal

model_keys:
  - gpt_oss_120b_or

limit: null
temperature: 0.0
concurrency: 4
timeout: 180
max_tokens: 512
