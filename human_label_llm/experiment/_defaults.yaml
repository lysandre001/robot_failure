# 各 experiment yaml 通过 extends: _defaults.yaml 继承本文件。
# 改模型 / 并发 / 数据路径，只改这里一处即可。

data:
  input_csv: human_label_llm/label_data/filtered_sample10_per_post_humanlabel.csv

columns:
  comment_id: comment_id
  comment: content

scope_slots:
  scope_comment_only: [comment]

scopes:
  - scope_comment_only

# 模型池：在 experiment 里用 model_keys 挑选子集；不写 model_keys 则用下面全部。
model_catalog:
  deepseek_v4_pro:
    provider: deepseek
    model: deepseek-v4-pro
    reasoning: on
    reasoning_effort: high

  gpt_5_5:
    provider: openrouter
    model: openai/gpt-5.5

  claude_4_7: anthropic/claude-opus-4.7

  deepseek_v4_pro_or:
    reasoning: on
    reasoning_effort: high
    chain:
      - provider: openrouter
        model: deepseek/deepseek-v4-pro
      - provider: deepseek
        model: deepseek-v4-pro

model_keys:
  - deepseek_v4_pro

temperature: 0.0
max_tokens: 2048
concurrency: 5
timeout: 180
limit: null
